<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Spark — open science lab for school students" />
    <title>Spark</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3Cpath d='M16 6c3 5 6 8 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 2 3 3 3 0-3-1-5 0-8z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1 id="title">Spark</h1>
        <p id="subtitle" class="muted"></p>
      </div>
      <button id="presets-open" class="presets-open" type="button"></button>
      <div class="prefs">
        <label><span id="lbl-language"></span><select id="language"></select></label>
        <label><span id="lbl-level"></span><select id="level"></select></label>
      </div>
    </header>

    <div class="app">
      <aside id="shelf" class="shelf" aria-labelledby="setup-title">
        <div class="panel-head"><h2 id="setup-title" class="shelf-title"></h2><button id="shelf-fold" class="fold-btn" type="button" aria-controls="shelf"></button></div>
        <button id="shelf-open" class="fold-strip" type="button" aria-controls="shelf"></button>
        <input id="search" class="search" type="search" autocomplete="off" />
        <div id="setup"></div>
      </aside>

      <main class="main">
        <section class="card kitchen">
          <div class="kitchen-head">
            <div>
              <h2 id="exp-title"></h2>
              <p id="setup-line" class="setup-line"></p>
            </div>
            <div class="buttons">
              <button id="start" class="primary" type="button"></button>
              <button id="reset" type="button"></button>
              <label class="speed"><span id="lbl-speed"></span><select id="speed"></select></label>
              <span class="weigh"><button id="weigh" type="button"></button><select id="scale" aria-label=""></select></span>
            </div>
          </div>
          <div id="scene"></div>
          <div id="quiz" class="quiz-wrap"></div>
          <div class="controls">
            <div class="control-left">
              <div id="knob-wrap"></div>
              <div id="switch-wrap" hidden><button id="switch" class="switch" type="button"></button></div>
            </div>
            <div class="readouts" aria-live="polite">
              <div id="r-time" class="readout"></div>
              <div id="r-water" class="readout water"></div>
              <div id="r-pot" class="readout pot"></div>
              <div id="r-power" class="readout"></div>
            </div>
          </div>
          <div id="chart-box" class="chart-box collapsed">
            <div class="chart-head"><button id="chart-toggle" class="chart-toggle" type="button" aria-controls="chart-body" aria-expanded="false"></button><span id="look-down" class="look-down" aria-hidden="true">👇</span></div>
            <div id="chart-body" class="chart-body">
              <div id="chart" class="chart-wrap"></div>
              <div id="legend" class="legend"></div>
            </div>
          </div>
          <div id="messages" class="messages"></div>
          <div id="offer"></div>
          <div id="energy" class="energy"></div>
        </section>

        <aside id="side" class="side">
          <button id="side-open" class="fold-strip card" type="button" aria-controls="side-body"></button>
          <div id="side-body" class="side-body">
          <section class="card">
            <div class="panel-head"><h3 id="protocol-title" class="side-title"></h3><button id="side-toggle" class="fold-btn" type="button" aria-controls="side-body" aria-expanded="true"></button></div>
            <ol id="protocol" class="protocol"></ol>
            <p id="protocol-hint" class="muted small"></p>
            <div id="records" class="records"></div>
          </section>
          <section class="card"><div id="expect" class="expect"></div></section>
          <section class="card"><details id="add" class="add" open></details></section>
          </div>
        </aside>

        <section class="card report-card">
          <button id="explain" class="primary wide" type="button"></button>
          <p id="explain-hint" class="muted small"></p>
          <article id="report" class="report"></article>
        </section>
      </main>
    </div>

    <aside id="ref" class="ref" aria-hidden="true" aria-labelledby="ref-body">
      <button id="ref-close" class="ref-close" type="button" aria-label="×">✕</button>
      <div id="ref-body" class="ref-body report"></div>
    </aside>

    <dialog id="presets" class="presets">
      <div class="presets-head">
        <h2 id="presets-title"></h2>
        <button id="presets-close" type="button" aria-label="×">✕</button>
      </div>
      <div id="presets-tabs" class="chips"></div>
      <div id="presets-list" class="presets-list"></div>
    </dialog>

    <div id="console-wrap" class="console-dock" aria-hidden="true">
      <div id="console-grip" class="console-grip" role="separator" aria-orientation="horizontal" tabindex="0"><span></span></div>
    </div>
    <button id="console-toggle" class="console-fab" type="button" aria-controls="console-wrap" aria-expanded="false">&gt;_</button>

    <footer><p id="footer" class="muted small"></p></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
